<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Rekuu AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        :root {
            --primary-color: #00d4ff;
            --primary-hover: #00b8e6;
            --bg-dark: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --bg-input: #2a2a4a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
        }
        
        /* Navbar */
        .navbar {
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            color: var(--text-primary);
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo i {
            color: var(--primary-color);
            font-size: 1.6rem;
        }
        
        .logo span {
            background: linear-gradient(135deg, var(--primary-color), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .username {
            color: var(--text-secondary);
            margin-right: 0.5rem;
            font-size: 0.9rem;
        }
        
        .btn {
            padding: 0.5rem 1.25rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: var(--text-primary);
        }
        
        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        
        /* Main Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            max-width: 100%;
            height: calc(100vh - 60px);
            overflow: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(15, 15, 35, 0.5);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .new-chat-btn {
            width: calc(100% - 1.5rem);
            margin: 1rem 0.75rem;
            padding: 0.875rem 1rem;
            background: linear-gradient(135deg, var(--primary-color), #0099cc);
            color: var(--text-primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        
        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.35);
        }
        
        .sidebar-header {
            padding: 1rem 1.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 0 0.75rem;
        }
        
        .chat-history::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        .chat-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        
        .chat-item.active {
            background: rgba(0, 212, 255, 0.15);
            color: var(--primary-color);
            border-left: 3px solid var(--primary-color);
        }
        
        .chat-item i {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        
        /* Chat Main Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 15, 35, 0.3);
            position: relative;
        }
        
        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }
        
        /* Welcome Message */
        .welcome-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 3rem 1rem;
            margin: auto;
        }
        
        .welcome-message h2 {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, var(--primary-color), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .welcome-message p {
            font-size: 1rem;
            opacity: 0.7;
        }
        
        /* Messages */
        .message {
            display: flex;
            gap: 1rem;
            max-width: 85%;
            animation: messageSlideIn 0.3s ease;
        }
        
        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--primary-color), #0099cc);
        }
        
        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .message-avatar i {
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        
        .message-content {
            background: var(--bg-input);
            padding: 0.875rem 1.25rem;
            border-radius: 18px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, var(--primary-color), #0099cc);
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            border-bottom-left-radius: 4px;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            display: none;
            padding: 1rem;
            background: var(--bg-input);
            border-radius: 18px;
            width: fit-content;
        }
        
        .typing-indicator.show {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding: 0.875rem 1.25rem;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
        
        /* Input Area - Fixed at bottom */
        .chat-input-area {
            padding: 1rem 1.5rem 1.25rem;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            position: sticky;
            bottom: 0;
            z-index: 50;
        }
        
        .chat-input-container {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
            background: var(--bg-input);
            border-radius: 24px;
            padding: 0.5rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }
        
        .chat-input-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
        }
        
        .upload-buttons {
            display: flex;
            gap: 0.25rem;
            padding-left: 0.25rem;
        }
        
        .upload-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }
        
        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary-color);
        }
        
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            padding: 0.625rem 0.5rem;
            outline: none;
            resize: none;
            max-height: 120px;
            min-height: 24px;
            line-height: 1.5;
        }
        
        .chat-input::placeholder {
            color: var(--text-secondary);
        }
        
        .send-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #0099cc);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Hidden file inputs */
        #imageInput, #fileInput {
            display: none;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .chat-messages {
                padding: 1rem;
            }
            
            .message {
                max-width: 90%;
            }
            
            .chat-input-area {
                padding: 0.75rem 1rem 1rem;
            }
            
            .navbar {
                padding: 0.75rem 1rem;
            }
            
            .username {
                display: none;
            }
        }
        
        @media (max-width: 480px) {
            .message-content {
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }
            
            .message-avatar {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-robot"></i>
            <span>Rekuu AI</span>
        </div>
        <div class="nav-buttons">
            <span class="username">Welcome, {{ user.name }}</span>
            <button class="btn btn-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>
    
    <div class="chat-container">
        <aside class="sidebar">
            <button class="new-chat-btn" onclick="newChat()">
                <i class="fas fa-plus"></i> New Chat
            </button>
            <div class="sidebar-header">Recent Chats</div>
            <div class="chat-history" id="chatHistory"></div>
        </aside>
        
        <main class="chat-main">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <h2><i class="fas fa-robot"></i> Welcome to Rekuu AI</h2>
                    <p>Start a conversation by typing a message below</p>
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
            
            <div class="chat-input-area">
                <div class="chat-input-container">
                    <div class="upload-buttons">
                        <button class="upload-btn" onclick="document.getElementById('imageInput').click()" title="Upload Image">
                            <i class="fas fa-image"></i>
                        </button>
                        <button class="upload-btn" onclick="document.getElementById('fileInput').click()" title="Upload File">
                            <i class="fas fa-paperclip"></i>
                        </button>
                    </div>
                    <input type="text" class="chat-input" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <input type="file" id="imageInput" accept="image/*" onchange="uploadImage(event)">
                <input type="file" id="fileInput" accept=".pdf,.txt,.docx,.csv" onchange="uploadFile(event)">
            </div>
        </main>
    </div>
    
    <script>
        let currentSessionId = null;
        let isProcessing = false;
        
        // Load chat history on page load
        document.addEventListener('DOMContentLoaded', loadChatHistory);
        
        // Auto-focus input on load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('messageInput').focus();
        });
        
        async function sendMessage() {
            if (isProcessing) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            input.value = '';
            
            // Add user message
            addMessage('user', message);
            showTyping(true);
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, session_id: currentSessionId })
                });
                
                const data = await response.json();
                showTyping(false);
                
                if (data.success) {
                    currentSessionId = data.session_id;
                    addMessage('assistant', data.response);
                    loadChatHistory();
                } else {
                    addMessage('assistant', 'Error: ' + data.message);
                }
            } catch (error) {
                showTyping(false);
                addMessage('assistant', 'Error: Failed to connect to server. Please check if the server is running.');
                console.error('Error:', error);
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }
        
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chatMessages');
            const welcomeMsg = messagesDiv.querySelector('.welcome-message');
            if (welcomeMsg) welcomeMsg.remove();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;
            messageDiv.innerHTML = '<div class="message-avatar"><i class="fas fa-' + (role === 'user' ? 'user' : 'robot') + '"></i></div><div class="message-content">' + escapeHtml(content) + '</div>';
            
            messagesDiv.appendChild(messageDiv);
            
            // Scroll to bottom with smooth animation
            setTimeout(() => {
                messagesDiv.scrollTo({
                    top: messagesDiv.scrollHeight,
                    behavior: 'smooth'
                });
            }, 10);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function showTyping(show) {
            const indicator = document.getElementById('typingIndicator');
            const messagesDiv = document.getElementById('chatMessages');
            
            indicator.classList.toggle('show', show);
            
            if (show) {
                // Move indicator to messages div
                if (!messagesDiv.contains(indicator)) {
                    messagesDiv.appendChild(indicator);
                }
                // Scroll to show typing indicator
                setTimeout(() => {
                    messagesDiv.scrollTo({
                        top: messagesDiv.scrollHeight,
                        behavior: 'smooth'
                    });
                }, 10);
            }
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey && !isProcessing) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        async function newChat() {
            try {
                const response = await fetch('/api/new-chat', { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    currentSessionId = data.session_id;
                    document.getElementById('chatMessages').innerHTML = '<div class="welcome-message"><h2><i class="fas fa-robot"></i> New Chat Started</h2></div>';
                    loadChatHistory();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function loadChatHistory() {
            try {
                const response = await fetch('/api/chat-history');
                const data = await response.json();
                if (data.success) {
                    const historyDiv = document.getElementById('chatHistory');
                    if (data.sessions.length === 0) {
                        historyDiv.innerHTML = '<p style="color: rgba(255,255,255,0.4); text-align: center; padding: 1rem; font-size: 0.85rem;">No chats yet</p>';
                    } else {
                        historyDiv.innerHTML = data.sessions.slice(0, 20).map(session => {
                            // Get title - use session.title or truncate first message
                            const title = session.title && session.title !== 'New Chat' ? session.title : 'New Chat';
                            return '<div class="chat-item ' + (session.id === currentSessionId ? 'active' : '') + '" onclick="loadSession(' + session.id + ')">' +
                            '<i class="fas fa-comment"></i> ' + truncateTitle(title) + '</div>';
                        }).join('');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // Truncate title to max 25 characters with "..."
        function truncateTitle(title) {
            if (!title) return 'New Chat';
            if (title.length <= 25) return title;
            return title.substring(0, 25) + '...';
        }
        
        async function loadSession(sessionId) {
            currentSessionId = sessionId;
            try {
                const response = await fetch('/api/chat-history?session_id=' + sessionId);
                const data = await response.json();
                if (data.success && data.messages) {
                    const messagesDiv = document.getElementById('chatMessages');
                    messagesDiv.innerHTML = '';
                    data.messages.forEach(msg => {
                        addMessage(msg.role === 'user' ? 'user' : 'assistant', msg.content);
                    });
                    loadChatHistory();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('image', file);
            formData.append('prompt', 'Describe this image in detail.');
            if (currentSessionId) formData.append('session_id', currentSessionId);
            
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            addMessage('user', '[Image: ' + file.name + ']');
            showTyping(true);
            
            try {
                const response = await fetch('/api/upload-image', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                showTyping(false);
                
                if (data.success) {
                    currentSessionId = data.session_id;
                    addMessage('assistant', data.response);
                    loadChatHistory();
                } else {
                    addMessage('assistant', 'Error: ' + data.message);
                }
            } catch (error) {
                showTyping(false);
                addMessage('assistant', 'Error: Failed to upload image');
                console.error('Error:', error);
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                event.target.value = '';
                document.getElementById('messageInput').focus();
            }
        }
        
        async function uploadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('prompt', 'Summarize this file and provide key insights.');
            if (currentSessionId) formData.append('session_id', currentSessionId);
            
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            addMessage('user', '[File: ' + file.name + ']');
            showTyping(true);
            
            try {
                const response = await fetch('/api/upload-file', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                showTyping(false);
                
                if (data.success) {
                    currentSessionId = data.session_id;
                    addMessage('assistant', data.response);
                    loadChatHistory();
                } else {
                    addMessage('assistant', 'Error: ' + data.message);
                }
            } catch (error) {
                showTyping(false);
                addMessage('assistant', 'Error: Failed to upload file');
                console.error('Error:', error);
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                event.target.value = '';
                document.getElementById('messageInput').focus();
            }
        }
        
        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/';
            } catch (error) {
                console.error('Error:', error);
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
